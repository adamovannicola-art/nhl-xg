[project]
name = "nhl-xg"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AdamoVannicola", email = "adamovannicola@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
]

[project.scripts]
nhl-xg = "nhl_xg:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
